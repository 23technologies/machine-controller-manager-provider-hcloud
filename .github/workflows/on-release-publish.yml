name: go:release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Update VERSION file
        run: |-
          echo "${{ github.ref_name }}" > VERSION
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          body: |-
            # [machine-controller-manager-provider-hcloud] ${{ github.ref_name }}

  on-publish:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Update VERSION file
        run: |-
          echo "${{ github.ref_name }}" > VERSION
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/machine-controller-manager-provider-hcloud:latest
            ghcr.io/${{ github.repository_owner }}/machine-controller-manager-provider-hcloud:${{ github.ref_name }}
